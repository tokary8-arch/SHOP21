<script>
const STORAGE_KEY = 'mgData';
let store = { shopName:'Marketgadget', announcement:'', customText:'', coverUrl:'', sdekUrl:'https://my.cdek.ru/m/lkfl/friend/REF-0M92GUWU', categories:['Одежда','Аксессуары','Для дома'], products:[{id:1,emoji:'&#128085;',name:'Футболка классическая',price:1900,stock:10,desc:'Удобная хлопковая футболка',chars:'Цвет: белый\nСостав: 100% хлопок',video:'',category:'Одежда'},{id:2,emoji:'&#129505;',name:'Кепка с логотипом',price:1200,stock:5,desc:'Стильная кепка',chars:'Цвет: красный\nРазмер: регулируемый',video:'',category:'Одежда'},{id:3,emoji:'&#9749;',name:'Кружка керамическая',price:800,stock:15,desc:'Керамическая кружка 300 мл',chars:'Объём: 300 мл\nМатериал: керамика',video:'',category:'Для дома'},{id:4,emoji:'&#127890;',name:'Рюкзак городской',price:3500,stock:3,desc:'Рюкзак 25л',chars:'Объём: 25 л\nЦвет: чёрный',video:'',category:'Аксессуары'}]};
let cart = {};
let currentUser = null;
let currentCategory = 'all';

function loadStore() {
  try { const d = JSON.parse(localStorage.getItem(STORAGE_KEY)); if (d) { store = { ...store, ...d }; if (!Array.isArray(d.products)) store.products = d.products || store.products; } } catch(e) {}
  applyStore();
}
function saveStore() { localStorage.setItem(STORAGE_KEY, JSON.stringify(store)); }

function applyStore() {
  document.title = store.shopName;
  document.getElementById('shopTitle').textContent = store.shopName;
  const ann = document.getElementById('announcement');
  if (store.announcement) { ann.textContent = store.announcement; ann.classList.remove('hidden'); } else { ann.classList.add('hidden'); }
  const ct = document.getElementById('customText');
  if (store.customText) { ct.innerHTML = store.customText.replace(/\*\*(.*?)\*\*/g, '<b>$1</b>').replace(/\n/g, '<br>'); ct.classList.remove('hidden'); } else { ct.classList.add('hidden'); }
  const coverImg = document.getElementById('coverImage');
  const coverPh = document.getElementById('coverPlaceholder');
  if (store.coverUrl) { coverImg.src = store.coverUrl; coverImg.style.display = 'block'; coverPh.style.display = 'none'; } else { coverImg.style.display = 'none'; coverPh.style.display = 'flex'; }
  renderCategories();
  renderCatalog();
}

function renderCategories() {
  const el = document.getElementById('catFilter');
  const cats = store.categories || [];
  let html = '<div class="cat-pill' + (currentCategory === 'all' ? ' active' : '') + '" onclick="setCategory(\'all\')">Все</div>';
  cats.forEach(c => { html += '<div class="cat-pill' + (c === currentCategory ? ' active' : '') + '" onclick="setCategory(\'' + escapeHtml(c) + '\')">' + escapeHtml(c) + '</div>'; });
  el.innerHTML = html;
}
function setCategory(cat) { currentCategory = cat; renderCategories(); renderCatalog(); }

function renderCatalog() {
  const el = document.getElementById('catalog');
  let filtered = store.products;
  if (currentCategory !== 'all') filtered = filtered.filter(p => p.category === currentCategory);
  if (!filtered.length) { el.innerHTML = '<div style="text-align:center;color:#86868b;padding:40px">Товаров пока нет</div>'; return; }
  el.innerHTML = filtered.map(p => {
    const inCart = cart[p.id] || 0;
    const isImage = p.emoji && (p.emoji.startsWith('http://') || p.emoji.startsWith('https://') || p.emoji.startsWith('data:'));
    const stockClass = p.stock <= 0 ? 'out' : p.stock <= 3 ? 'low' : '';
    const stockText = p.stock <= 0 ? 'Нет в наличии' : p.stock <= 3 ? 'Осталось ' + p.stock : 'В наличии: ' + p.stock;
    const chars = p.chars ? p.chars.split('\n').filter(Boolean).map(c => '<span>' + escapeHtml(c) + '</span>').join(' ') : '';
    return '<div class="card"><div class="card-media">' + (isImage ? '<img src="' + p.emoji + '" alt="' + escapeHtml(p.name) + '">' : p.emoji) + (p.video ? '<a class="play-badge" href="' + p.video + '" target="_blank" rel="noopener">&#9654; Видео</a>' : '') + '</div><div class="card-body"><h3>' + escapeHtml(p.name) + '</h3>' + (p.desc ? '<div class="desc">' + escapeHtml(p.desc) + '</div>' : '') + (chars ? '<div class="chars">' + chars + '</div>' : '') + '<div class="price-row"><div><div class="price">' + formatPrice(p.price) + '</div><div class="stock ' + stockClass + '">' + stockText + '</div></div><button class="cart-add" onclick="addToCart(' + p.id + ')" ' + (p.stock <= 0 ? 'disabled' : '') + '>' + (inCart > 0 ? '&#43; ещё' : 'В корзину') + '</button></div></div></div>';
  }).join('');
}

function formatPrice(v) { return Number(v).toLocaleString('ru-RU') + ' &#8381;'; }
function escapeHtml(s) { if (!s) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }

function addToCart(id) {
  const p = store.products.find(x => x.id === id);
  if (!p || p.stock <= 0) return;
  const inCart = cart[id] || 0;
  if (inCart >= p.stock) { showToast('Нет больше на складе'); return; }
  cart[id] = (cart[id] || 0) + 1;
  updateCart();
  showToast('&#10003; ' + p.name + ' добавлен');
}
function removeFromCart(id) { if (cart[id]) cart[id]--; if (cart[id] <= 0) delete cart[id]; updateCart(); }
function clearCart() { if (!Object.keys(cart).length) return; if (!confirm('Очистить корзину?')) return; cart = {}; updateCart(); showToast('Корзина очищена'); }

function updateCart() {
  const count = Object.values(cart).reduce((a,b)=>a+b,0);
  const total = Object.keys(cart).reduce((s,id) => { const p = store.products.find(x => x.id === +id); return s + (p ? p.price * cart[id] : 0); }, 0);
  document.getElementById('cartTotal').innerHTML = formatPrice(total);
  const badge = document.getElementById('cartBadge');
  if (count > 0) { badge.textContent = count; badge.style.display = 'inline'; } else { badge.style.display = 'none'; }
  renderCartItems();
  saveCart();
}

function renderCartItems() {
  const el = document.getElementById('cartItems');
  const ids = Object.keys(cart);
  if (!ids.length) { el.innerHTML = '<div class="cart-empty">Корзина пуста</div>'; return; }
  el.innerHTML = ids.map(id => {
    const p = store.products.find(x => x.id === +id);
    if (!p) return '';
    const q = cart[id];
    const isImage = p.emoji && (p.emoji.startsWith('http://') || p.emoji.startsWith('https://') || p.emoji.startsWith('data:'));
    const thumb = isImage ? '<img src="' + p.emoji + '" style="width:32px;height:32px;border-radius:6px;object-fit:cover;vertical-align:middle;margin-right:6px">' : p.emoji;
    return '<div class="cart-item"><div class="cart-item-info"><div class="cart-item-title">' + thumb + ' ' + escapeHtml(p.name) + '</div><div class="cart-item-price">' + formatPrice(p.price) + ' &#215; ' + q + ' = ' + formatPrice(p.price * q) + '</div></div><div class="cart-item-qty"><button onclick="removeFromCart(' + id + ')">&#8722;</button><span>' + q + '</span><button onclick="addToCart(' + id + ')">+</button></div></div>';
  }).join('');
}

function saveCart() { localStorage.setItem('mgCart', JSON.stringify(cart)); }
function loadCart() {
  try { const d = JSON.parse(localStorage.getItem('mgCart')); if (d) cart = d; updateCart(); } catch(e) {}
  try { const u = JSON.parse(localStorage.getItem('mgUser')); if (u) { currentUser = u; updateProfileBtn(); } } catch(e) {}
}

function openCart() { document.getElementById('cartOverlay').classList.add('open'); document.getElementById('cartPanel').classList.add('open'); showCartItems(); }
function closeCart() { document.getElementById('cartOverlay').classList.remove('open'); document.getElementById('cartPanel').classList.remove('open'); document.getElementById('orderConfirmed').classList.remove('active'); }
function showCheckoutForm() {
  if (!Object.keys(cart).length) { showToast('Корзина пуста'); return; }
  if (currentUser) { document.getElementById('coName').value = currentUser.name || ''; document.getElementById('coEmail').value = currentUser.email || ''; document.getElementById('coPhone').value = currentUser.phone || ''; document.getElementById('coAddress').value = currentUser.address || ''; }
  document.getElementById('cartItems').classList.add('hidden'); document.getElementById('cartFooter').style.display = 'none'; document.getElementById('checkoutForm').classList.add('active');
}
function showCartItems() { document.getElementById('cartItems').classList.remove('hidden'); document.getElementById('cartFooter').style.display = 'block'; document.getElementById('checkoutForm').classList.remove('active'); document.getElementById('orderConfirmed').classList.remove('active'); }

function submitOrder() {
  const name = document.getElementById('coName').value.trim(); const email = document.getElementById('coEmail').value.trim(); const phone = document.getElementById('coPhone').value.trim();
  if (!name || !email || !phone) { showToast('Заполните ФИО, Email и телефон'); return; }
  const items = Object.keys(cart).map(id => { const p = store.products.find(x => x.id === +id); return p ? { name:p.name, price:p.price, qty:cart[id] } : null; }).filter(Boolean);
  const total = items.reduce((s,i) => s + i.price * i.qty, 0);
  const orderId = 'ORD-' + Date.now().toString(36).toUpperCase();
  const order = { id:orderId, date:new Date().toISOString(), name, email, phone, address:document.getElementById('coAddress').value.trim(), comment:document.getElementById('coComment').value.trim(), items, total, user: currentUser?.email || email };
  const orders = JSON.parse(localStorage.getItem('mgOrders') || '[]'); orders.unshift(order); localStorage.setItem('mgOrders', JSON.stringify(orders));
  if (currentUser) { currentUser.orders = currentUser.orders || []; currentUser.orders.unshift(orderId); localStorage.setItem('mgUser', JSON.stringify(currentUser)); }
  document.getElementById('cdekPayLink').href = store.sdekUrl || 'https://my.cdek.ru/m/lkfl/friend/REF-0M92GUWU';
  document.getElementById('orderId').textContent = 'Номер заказа: ' + orderId;
  document.getElementById('cartItems').innerHTML = ''; document.getElementById('cartFooter').style.display = 'none'; document.getElementById('checkoutForm').classList.remove('active'); document.getElementById('orderConfirmed').classList.add('active');
  cart = {}; updateCart(); closeCart(); document.getElementById('orderConfirmed').classList.add('active');
  showToast('Заказ оформлен!');
}

// --- Chat ---
function toggleChat() { document.getElementById('chatWindow').classList.toggle('open'); }
function sendChat() {
  const input = document.getElementById('chatInput'); const text = input.value.trim();
  if (!text) return; input.value = '';
  const msgs = document.getElementById('chatMessages');
  const now = new Date().toLocaleTimeString('ru-RU', {hour:'2-digit',minute:'2-digit'});
  msgs.insertAdjacentHTML('beforeend', '<div class="chat-msg user">' + escapeHtml(text) + '<span class="time">' + now + '</span></div>');
  const history = JSON.parse(localStorage.getItem('mgChatHistory') || '[]');
  history.push({text, time: new Date().toISOString()});
  localStorage.setItem('mgChatHistory', JSON.stringify(history));
  setTimeout(() => {
    msgs.insertAdjacentHTML('beforeend', '<div class="chat-msg bot">Спасибо! Ответим в ближайшее время.<span class="time">' + new Date().toLocaleTimeString('ru-RU', {hour:'2-digit',minute:'2-digit'}) + '</span></div>');
    msgs.scrollTop = msgs.scrollHeight;
  }, 600);
  msgs.scrollTop = msgs.scrollHeight;
}

// --- Profile ---
function openProfile() { document.getElementById('profileOverlay').classList.add('open'); document.getElementById('profilePanel').classList.add('open'); renderProfile(); }
function closeProfile() { document.getElementById('profileOverlay').classList.remove('open'); document.getElementById('profilePanel').classList.remove('open'); }
function renderProfile() {
  const el = document.getElementById('profileContent');
  if (currentUser) {
    const orders = JSON.parse(localStorage.getItem('mgOrders') || '[]').filter(o => o.user === currentUser.email);
    el.innerHTML = '<div class="welcome-text">&#10003; Вы авторизованы как <b>' + escapeHtml(currentUser.name) + '</b></div><h3>Мои данные</h3><input type="text" id="puName" placeholder="ФИО" value="' + escapeHtml(currentUser.name||'') + '"><input type="email" id="puEmail" placeholder="Email" value="' + escapeHtml(currentUser.email||'') + '"><input type="tel" id="puPhone" placeholder="Телефон" value="' + escapeHtml(currentUser.phone||'') + '"><input type="text" id="puAddress" placeholder="Адрес" value="' + escapeHtml(currentUser.address||'') + '"><button class="profile-btn" onclick="updateProfile()">Сохранить</button><h3>Мои заказы</h3><div class="orders-list">' + (orders.length ? orders.map(o => '<div class="order-item"><div class="order-num">' + o.id + '</div><div class="order-date">' + new Date(o.date).toLocaleDateString('ru-RU') + ' — ' + formatPrice(o.total) + '</div></div>').join('') : '<div style="color:#86868b;font-size:14px">Заказов пока нет</div>') + '</div><button class="profile-btn outline" style="margin-top:16px" onclick="logout()">Выйти</button>';
  } else {
    el.innerHTML = '<h2>Вход / Регистрация</h2><input type="text" id="regName" placeholder="Ваше имя"><input type="email" id="regEmail" placeholder="Email"><input type="tel" id="regPhone" placeholder="Телефон"><input type="password" id="regPass" placeholder="Пароль"><input type="text" id="regAddress" placeholder="Адрес (необязательно)"><button class="profile-btn" onclick="registerUser()">Зарегистрироваться</button><button class="profile-btn outline" onclick="loginUser()">Уже есть аккаунт? Войти</button>';
  }
}
function registerUser() {
  const name = document.getElementById('regName').value.trim(); const email = document.getElementById('regEmail').value.trim(); const phone = document.getElementById('regPhone').value.trim(); const pass = document.getElementById('regPass').value;
  if (!name || !email || !phone || !pass) { showToast('Заполните все поля'); return; }
  const users = JSON.parse(localStorage.getItem('mgUsers') || '[]');
  if (users.find(u => u.email === email)) { showToast('Email уже занят'); return; }
  const user = { name, email, phone, pass, address: document.getElementById('regAddress').value.trim(), orders: [], regDate: new Date().toISOString() };
  users.push(user); localStorage.setItem('mgUsers', JSON.stringify(users));
  currentUser = user; localStorage.setItem('mgUser', JSON.stringify(user));
  updateProfileBtn(); renderProfile(); showToast('Регистрация успешна!');
}
function loginUser() {
  const email = prompt('Email:'); if (!email) return;
  const pass = prompt('Пароль:'); if (!pass) return;
  const users = JSON.parse(localStorage.getItem('mgUsers') || '[]');
  const user = users.find(u => u.email === email && u.pass === pass);
  if (!user) { showToast('Неверный email или пароль'); return; }
  currentUser = user; localStorage.setItem('mgUser', JSON.stringify(user));
  updateProfileBtn(); renderProfile(); showToast('&#10003; Вход выполнен');
}
function updateProfile() {
  const name = document.getElementById('puName').value.trim(); const email = document.getElementById('puEmail').value.trim(); const phone = document.getElementById('puPhone').value.trim(); const address = document.getElementById('puAddress').value.trim();
  if (!name || !email || !phone) { showToast('Заполните поля'); return; }
  const users = JSON.parse(localStorage.getItem('mgUsers') || '[]');
  const idx = users.findIndex(u => u.email === currentUser.email);
  if (idx >= 0) { users[idx].name = name; users[idx].email = email; users[idx].phone = phone; users[idx].address = address; }
  currentUser = { ...currentUser, name, email, phone, address };
  localStorage.setItem('mgUser', JSON.stringify(currentUser));
  if (idx >= 0) localStorage.setItem('mgUsers', JSON.stringify(users));
  updateProfileBtn(); showToast('Сохранено');
}
function logout() { currentUser = null; localStorage.removeItem('mgUser'); updateProfileBtn(); renderProfile(); showToast('Вы вышли'); }
function updateProfileBtn() { document.getElementById('profileBtn').innerHTML = currentUser ? '&#128100; ' + escapeHtml(currentUser.name) : '&#128100; Войти'; }

function showToast(msg) { const t=document.getElementById('toast'); t.innerHTML=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2000); }

loadStore();
loadCart();
</script>
